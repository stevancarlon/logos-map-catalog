name: Packaged Basecamp real hosting E2E
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  hosting:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: true
    - uses: logos-co/setup-nix-cache-action@781f072122f4df6af0e33a7d355ebd20283e019e
    - name: Build pinned package verifier
      run: nix build github:logos-co/logos-package/c25a1167578aef5cbd9a9b6f822ffe2ae4fd6a89#lgx --out-link "$RUNNER_TEMP/lgx-tool"
    - name: Fetch released modules and pinned Basecamp
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/map-packages\"\nfor item in logos_maps:0.2.0 maps_publisher:0.1.0 maps_distribution:0.2.0; do\n  name=\"${item%:*}\"; version=\"${item#*:}\"\n  mkdir -p \"$RUNNER_TEMP/map-packages/$name\"\n  gh release download \"$name-v$version\" --repo \"$GITHUB_REPOSITORY\" --pattern '*.lgx' --dir \"$RUNNER_TEMP/map-packages/$name\"\ndone\nif [[ \"$RUNNER_OS\" == Linux ]]; then\n  asset='LogosBasecamp-Desktop-v0.3.2-f2fae6-x86_64.AppImage'\nelse\n  asset='LogosBasecamp-Desktop-v0.3.2-f2fae6-aarch64.dmg'\nfi\ngh release download 0.3.2 --repo logos-co/logos-basecamp --pattern \"$asset\" --dir \"$RUNNER_TEMP\"\npython3 - <<'PY'\nimport hashlib,os,pathlib\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])\nname,digest = ('LogosBasecamp-Desktop-v0.3.2-f2fae6-x86_64.AppImage','983de0c7e282155d93c7e338da78e5b1a7a32112390a89be48d44700c3ade012') if os.environ['RUNNER_OS']=='Linux' else ('LogosBasecamp-Desktop-v0.3.2-f2fae6-aarch64.dmg','636031934f4d747819d4e7737094d8328c4506d61ffca25a0744dccec0adee10')\n\
        assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest\nwith open(os.environ['GITHUB_ENV'],'a') as env:\n    env.write('MAPS_RELEASE_LGX='+str(root/'lgx-tool/bin/lgx')+'\\n')\n    for module,key in [('logos_maps','APP'),('maps_publisher','PUBLISHER'),('maps_distribution','DISTRIBUTION')]:\n        files=list((root/'map-packages'/module).glob('*.lgx'))\n        assert len(files)==1,files\n        env.write('MAPS_RELEASE_'+key+'_LGX='+str(files[0])+'\\n')\nPY\n"
    - name: Prepare Linux Basecamp
      if: runner.os == 'Linux'
      shell: bash
      run: 'set -euo pipefail

        sudo apt-get update -qq

        sudo apt-get install -y libopengl0 libegl1

        cd "$RUNNER_TEMP"

        chmod +x LogosBasecamp-Desktop-v0.3.2-f2fae6-x86_64.AppImage

        ./LogosBasecamp-Desktop-v0.3.2-f2fae6-x86_64.AppImage --appimage-extract > /dev/null

        echo "BASECAMP=$RUNNER_TEMP/squashfs-root/AppRun" >> "$GITHUB_ENV"

        '
    - name: Prepare Apple Silicon Basecamp
      if: runner.os == 'macOS'
      shell: bash
      run: "set -euo pipefail\nhdiutil attach -readonly -nobrowse -mountpoint \"$RUNNER_TEMP/basecamp-mount\" \"$RUNNER_TEMP/LogosBasecamp-Desktop-v0.3.2-f2fae6-aarch64.dmg\"\npython3 - <<'PY'\nimport os,pathlib,plistlib,subprocess\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])\napps=list((root/'basecamp-mount').glob('*.app'));assert len(apps)==1\ndest=root/'LogosBasecamp.app'\nsubprocess.run(['ditto',str(apps[0]),str(dest)],check=True)\ninfo=plistlib.loads((dest/'Contents/Info.plist').read_bytes())\nexecutable=info['CFBundleExecutable'];assert pathlib.Path(executable).name==executable\nwith open(os.environ['GITHUB_ENV'],'a') as env:\n    env.write('BASECAMP='+str(dest/'Contents/MacOS'/executable)+'\\n')\nPY\nhdiutil detach \"$RUNNER_TEMP/basecamp-mount\"\n"
    - name: Install build dependencies and pinned host Rust
      run: "if [[ \"$RUNNER_OS\" == Linux ]]; then\n  sudo apt-get update -qq\n  sudo apt-get install -y clang libclang-dev libssl-dev pkg-config cmake ninja-build libpcsclite-dev\nelse\n  brew install pkg-config openssl@3 cmake ninja\n  echo \"OPENSSL_DIR=$(brew --prefix openssl@3)\" >> \"$GITHUB_ENV\"\nfi\nrustup toolchain install 1.98.1 --profile minimal\necho 'RUSTUP_TOOLCHAIN=1.98.1' >> \"$GITHUB_ENV\"\n"
      shell: bash
    - name: Install verified guest compiler and executor
      shell: bash
      run: "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/map-tools/compiler\" \"$RUNNER_TEMP/map-tools/executor\"\ncd \"$RUNNER_TEMP/map-tools\"\nif [[ \"$RUNNER_OS\" == Linux ]]; then triple=x86_64-unknown-linux-gnu; else triple=aarch64-apple-darwin; fi\ncurl --fail --location --retry 3 -o rust.tar.gz \"https://github.com/risc0/rust/releases/download/r0.1.97.0/rust-toolchain-$triple.tar.gz\"\ncurl --fail --location --retry 3 -o executor.tgz \"https://github.com/risc0/risc0/releases/download/v3.0.5/cargo-risczero-$triple.tgz\"\npython3 - <<'PY'\nimport hashlib,pathlib,tarfile,os\nhashes={'rust.tar.gz':'85070d82aebbe8e1027e75f2cd0c781f5c82c0ae7e06697218be9d8b71dec15d','executor.tgz':'0f676055ad88d7ede06beaec3b7f850413e091db08bb7cf9969a78d9ad168562'} if os.environ['RUNNER_OS']=='macOS' else {}\nfor name,digest,dest in [('rust.tar.gz','100b597d605b706bec94e1d32bfaaf5851df8d75173f986d4b56a3e90916be53','compiler'),('executor.tgz','936ef988b78f20e3bd9f80e375f3adc934b13addc6ae2680f2e5fc0bcc966158','executor')]:\n\
        \    digest=hashes.get(name,digest)\n    with open(name,'rb') as stream: assert hashlib.file_digest(stream,'sha256').hexdigest()==digest\n    with tarfile.open(name) as archive: archive.extractall(dest,filter='data')\ncompilers=list(pathlib.Path('compiler').rglob('bin/rustc')); assert len(compilers)==1,compilers\nexecutor=pathlib.Path('executor/r0vm'); assert executor.is_file()\nwith open(os.environ['GITHUB_ENV'],'a') as env:\n    env.write('RISC0_RUSTC='+str(compilers[0].resolve())+'\\n')\n    env.write('RISC0_SERVER_PATH='+str(executor.resolve())+'\\n')\nPY\n"
    - name: Prepare published integration sources
      shell: bash
      run: 'set -euo pipefail

        source="$GITHUB_WORKSPACE/submodules/maps/sdk/source"

        mkdir -p "$source/scripts" "$source/artifacts" "$source/evidence" "$source/.tmp"

        cp submodules/maps/integration/scripts/{build-maps-v03-guest.sh,build-v03-sequencer.py,test-v03-sequencer.py,test-maps-publish-cli.py,test-maps-v03-host.py,test-basecamp-maps-hosting.py,install-maps-ui.py,install-maps-release.py,fixture_process.py} "$source/scripts/"

        git clone --filter=blob:none https://github.com/logos-blockchain/logos-execution-zone.git "$RUNNER_TEMP/sequencer-source"

        git -C "$RUNNER_TEMP/sequencer-source" checkout --detach db66590ab821a4e142c211017a3866d007f6fa77

        cp -R submodules/maps/integration/native "$source/native"

        '
    - name: Build guest and SDK chain client
      working-directory: submodules/maps/sdk/source
      shell: bash
      run: 'set -euo pipefail

        bash scripts/build-maps-v03-guest.sh

        CARGO_TARGET_DIR="$PWD/target" cargo build --manifest-path lez-v03/Cargo.toml --locked -p logos-maps-v03-sdk --example maps-chain --example maps-discovery

        CARGO_TARGET_DIR="$PWD/target" cargo build --manifest-path lez-v03/Cargo.toml --locked -p logos-maps-v03-publisher --example native-publisher-fixture

        '
    - name: Build unmodified pinned standalone sequencer
      working-directory: submodules/maps/sdk/source
      run: python3 scripts/build-v03-sequencer.py --source "$RUNNER_TEMP/sequencer-source" --target-dir "$RUNNER_TEMP/sequencer-build"
    - name: Run packaged Basecamp bulk hosting and restart recovery
      working-directory: submodules/maps/sdk/source
      shell: bash
      run: "set -euo pipefail\nif [[ \"$RUNNER_OS\" == Linux ]]; then storage_platform=linux-amd64; else storage_platform=darwin-arm64; fi\ncurl --fail --location --retry 3 -o \"$RUNNER_TEMP/storage.zip\" \"https://github.com/logos-storage/logos-storage-nim/releases/download/v0.5.3/logos-storage-$storage_platform-v0.5.3.zip\"\npython3 - <<'PYCODE'\nimport hashlib,os,pathlib,zipfile\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])\nplatform='darwin-arm64' if os.environ['RUNNER_OS']=='macOS' else 'linux-amd64'\nname='logos-storage-'+platform+'-v0.5.3'\ndigest='7f32f62a14e555399ee003f11d1e29bba9b6ff842d973f38b5b280f018c2f6ab' if platform=='darwin-arm64' else '1086fae4f283cab882f133abe4d5a88cfae8d61edba9f0094c7f75b368ec9d56'\nwith (root/'storage.zip').open('rb') as stream:\n    assert hashlib.file_digest(stream,'sha256').hexdigest()==digest\nwith zipfile.ZipFile(root/'storage.zip') as archive:\n    names=archive.namelist()\n    assert names==[name],names\n    archive.extractall(root/'storage')\n\
        (root/'storage'/name).chmod(0o755)\nPYCODE\npython3 scripts/test-maps-v03-host.py --storage \"$RUNNER_TEMP/storage/logos-storage-$storage_platform-v0.5.3\" --sequencer artifacts/lez-v03-runtime/sequencer_service --basecamp \"$BASECAMP\" --bulk-fetch-ui --mode fetch > artifacts/hosted-bulk-ui-result.log 2>&1\n"
    - name: Preserve integration evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: packaged-bulk-ui-${{ runner.os }}-${{ runner.arch }}
        path: 'submodules/maps/sdk/source/evidence/

          submodules/maps/sdk/source/artifacts/*.log

          submodules/maps/sdk/source/artifacts/hosted-source-discovery.json

          submodules/maps/sdk/source/artifacts/lez-v03-runtime/build.json

          '
        if-no-files-found: warn
