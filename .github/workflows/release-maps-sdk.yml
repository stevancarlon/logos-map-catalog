# Copy into a fork of logos-modules-release-base after adding the selected
# source export as a git submodule. Replace sdk with sdk/publisher/distribution/app.
name: Release Maps sdk
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    uses: logos-co/logos-modules-release-action/.github/workflows/release.yml@00ad4e5adb7aac75b3e3f3acc6b8d7a466294e9c
    with:
      module_path: submodules/maps/sdk
      variants: darwin-arm64,linux-amd64
      signing_mode: none
      skip_if_published: true
