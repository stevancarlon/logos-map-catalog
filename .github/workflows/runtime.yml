name: Packaged Basecamp runtime
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Release all Map Library modules]
    types: [completed]
permissions:
  contents: read
jobs:
  runtime:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: true
      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build pinned package verifier
        run: nix build github:logos-co/logos-package/c25a1167578aef5cbd9a9b6f822ffe2ae4fd6a89#lgx --out-link "$RUNNER_TEMP/lgx-tool"
      - name: Fetch released modules and pinned Basecamp
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/map-packages"
          for item in logos_maps:0.2.0 maps_publisher:0.1.0 maps_distribution:0.2.0; do
            name="${item%:*}"; version="${item#*:}"
            mkdir -p "$RUNNER_TEMP/map-packages/$name"
            gh release download "$name-v$version" --repo "$GITHUB_REPOSITORY" --pattern '*.lgx' --dir "$RUNNER_TEMP/map-packages/$name"
          done
          if [[ "$RUNNER_OS" == Linux ]]; then
            asset='LogosBasecamp-Desktop-v0.3.2-f2fae6-x86_64.AppImage'
          else
            asset='LogosBasecamp-Desktop-v0.3.2-f2fae6-aarch64.dmg'
          fi
          gh release download 0.3.2 --repo logos-co/logos-basecamp --pattern "$asset" --dir "$RUNNER_TEMP"
          python3 - <<'PY'
          import hashlib,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          name,digest = ('LogosBasecamp-Desktop-v0.3.2-f2fae6-x86_64.AppImage','983de0c7e282155d93c7e338da78e5b1a7a32112390a89be48d44700c3ade012') if os.environ['RUNNER_OS']=='Linux' else ('LogosBasecamp-Desktop-v0.3.2-f2fae6-aarch64.dmg','636031934f4d747819d4e7737094d8328c4506d61ffca25a0744dccec0adee10')
          assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('MAPS_RELEASE_LGX='+str(root/'lgx-tool/bin/lgx')+'\n')
              for module,key in [('logos_maps','APP'),('maps_publisher','PUBLISHER'),('maps_distribution','DISTRIBUTION')]:
                  files=list((root/'map-packages'/module).glob('*.lgx'))
                  assert len(files)==1,files
                  env.write('MAPS_RELEASE_'+key+'_LGX='+str(files[0])+'\n')
          PY
      - name: Prepare Linux Basecamp
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          chmod +x LogosBasecamp-Desktop-v0.3.2-f2fae6-x86_64.AppImage
          ./LogosBasecamp-Desktop-v0.3.2-f2fae6-x86_64.AppImage --appimage-extract > /dev/null
          echo "BASECAMP=$RUNNER_TEMP/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: Prepare Apple Silicon Basecamp
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/basecamp-mount" "$RUNNER_TEMP/LogosBasecamp-Desktop-v0.3.2-f2fae6-aarch64.dmg"
          python3 - <<'PY'
          import os,pathlib,plistlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          apps=list((root/'basecamp-mount').glob('*.app'));assert len(apps)==1
          dest=root/'LogosBasecamp.app'
          subprocess.run(['ditto',str(apps[0]),str(dest)],check=True)
          info=plistlib.loads((dest/'Contents/Info.plist').read_bytes())
          executable=info['CFBundleExecutable'];assert pathlib.Path(executable).name==executable
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('BASECAMP='+str(dest/'Contents/MacOS'/executable)+'\n')
          PY
          hdiutil detach "$RUNNER_TEMP/basecamp-mount"
      - name: Run actual packaged app fixture
        shell: bash
        run: |
          set -euo pipefail
          cd submodules/maps/integration
          mkdir -p artifacts evidence
          python3 scripts/test-basecamp-maps.py --basecamp "$BASECAMP" > artifacts/runtime-result.log 2>&1
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: basecamp-runtime-${{ runner.os }}-${{ runner.arch }}
          path: |
            submodules/maps/integration/artifacts/
            submodules/maps/integration/evidence/
          if-no-files-found: warn
