name: Release all Map Library modules
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        module: [sdk, publisher, distribution, app]
    uses: logos-co/logos-modules-release-action/.github/workflows/release.yml@00ad4e5adb7aac75b3e3f3acc6b8d7a466294e9c
    with:
      module_path: submodules/maps/${{ matrix.module }}
      variants: darwin-arm64,linux-amd64
      signing_mode: none
      skip_if_published: true
